<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "My Digital Guardian",
  "schemaVersion": 1,
  "description": "My Digital Guardian — a checklist and educational tool for everyday personal cyber hygiene. Add your own devices, smart things and accounts; check off what's already true; read why the rest matters; get a short prioritized list. Runs entirely offline, keeps nothing.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D2E">
<!-- Nothing may leave this page. default-src 'none' blocks fetch, XHR, beacons, websockets,
     frames and fonts outright; the only permitted image source is the inlined data: logo.
     frame-ancestors is omitted deliberately: it is ignored in a meta tag and must be an HTTP header,
     so set it server-side if this is ever hosted. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>My Digital Guardian</title>
<style>
:root{
  --brand:#1F4D2E; --brand-dk:#17391F; --accent:#2E7A4E; --on-dark:#9FE1CB;
  --bg:#E7F0E7; --card:#FFFFFF; --cb:#D7E4D7; --divider:#E4EEE4; --fb:#CBD8CB;
  --t1:#22372A; --t2:#5F7266; --t3:#7A8F80; --ink:#111111;
  --crit-dot:#E24B4A; --crit-t:#A32D2D; --crit-bg:#FCEBEB;
  --rev-dot:#D4C000;  --caut-t:#7A6514;
  --ok-dot:#2E7A4E;   --ok-t:#1F6E43;   --ok-bg:#E2EFE8;
  --info-t:#1A5FA8;   --info-bg:#E6F0FA;
  --sh:0 1px 2px rgba(31,77,46.05),0 6px 18px rgba(31,77,46.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);
 color:var(--t1);font-size:16.5px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
svg{width:1em;height:1em;flex:none}
.col{width:100%;max-width:560px;margin:0 auto;padding:0 20px}


.bar{background:var(--brand);color:#fff;padding:13px 0;position:sticky;top:0;z-index:20}
.bar .col{display:flex;align-items:center;gap:12px;min-height:46px}
.bar .brand{display:flex;align-items:center;gap:12px}
.bar img{height:38px;display:block}
.bar .wm{font-size:18px;font-weight:600;letter-spacing:-.2px}
.bar .sp{flex:1}
.bar .back{display:flex;align-items:center;gap:6px;color:var(--on-dark);font-size:15.5px;font-weight:600;padding:8px 6px;margin-right:-6px}
.bar .back svg{width:17px;height:17px}
.bar .ttl{font-size:16.5px;font-weight:600}

main{flex:1;padding:22px 0 36px}
.sc{animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

h1{font-size:29px;line-height:1.18;font-weight:600;letter-spacing:-.5px}
h2{font-size:23px;line-height:1.24;font-weight:600;letter-spacing:-.35px}
.sub{color:var(--t2);font-size:15.5px;margin-top:9px}
.eyebrow{font-size:12px;letter-spacing:.85px;text-transform:uppercase;color:var(--t3);font-weight:700}

.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand);
 color:#fff;border-radius:14px;padding:16px;font-size:16.5px;font-weight:600;box-shadow:var(--sh)}
.big:active{background:var(--brand-dk);transform:scale(.99)}
.big.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--cb);box-shadow:none}
.wipe{display:block;width:100%;text-align:center;padding:13px;font-size:14.5px;font-weight:600;color:var(--t2);border-radius:14px}
.wipe:active{background:#fff}
.big[disabled]{opacity:.4;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:24px}

.welcome{text-align:center;padding-top:22px}
.crest{width:128px;height:128px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 8px 26px rgba(31,77,46.22)}
.crest img{width:80px;display:block}
.welcome h1{font-size:31px}
.welcome .sub{font-size:17px;max-width:33ch;margin:12px auto 0}
.purpose{font-size:16.5px;line-height:1.55;color:var(--t2);text-align:left;margin:14px 0 0}
.purpose+.purpose{margin-top:11px}
.promise{display:flex;flex-direction:column;gap:15px;margin:16px 0 30px;text-align:left}
.promise .p{display:flex;gap:13px;align-items:flex-start}
.promise .ic{width:38px;height:38px;border-radius:11px;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center}
.promise .ic svg{width:20px;height:20px}
.promise b{display:block;font-size:15.5px;font-weight:600}
.promise span{font-size:14.5px;color:var(--t2)}
.fine{font-size:13.5px;color:var(--t3);margin-top:18px;display:flex;align-items:flex-start;justify-content:center;gap:8px;text-align:left;max-width:36ch;margin-left:auto;margin-right:auto}
.fine svg{width:16px;height:16px;margin-top:2px}

.hero{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--sh);margin-bottom:18px}
.hero .top{display:flex;align-items:center;gap:16px}
.ring{width:64px;height:64px;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:14.5px;font-weight:700;color:var(--brand)}
.hero .msg{font-size:17px;font-weight:600;line-height:1.32}
.hero .msg small{display:block;font-weight:400;font-size:14.5px;color:var(--t2);margin-top:5px;line-height:1.45}

.grp{margin-bottom:20px}
.grp .eyebrow{margin:22px 0 10px;display:block}
.todo{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:14px;padding:14px 15px;box-shadow:var(--sh);margin-bottom:9px;width:100%}
.todo .flag{width:34px;height:34px;border-radius:10px;background:var(--crit-bg);color:var(--crit-t);display:grid;place-items:center}
.todo .flag svg{width:18px;height:18px}
.todo.look .flag{background:var(--info-bg);color:var(--info-t)}
.todo.habit .flag{background:var(--ok-bg);color:var(--ok-t)}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:15px;font-weight:600;line-height:1.34}
.todo .tx span{font-size:13.5px;color:var(--t2)}
.todo .go{color:var(--t3)}
.todo .go svg{width:18px;height:18px}
.hint2{font-size:13.5px;color:var(--t3);margin-top:5px}
.hint2 b{color:var(--t2)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.cat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:flex-start}
.cat .ic{width:40px;height:40px;border-radius:12px;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center;margin-bottom:11px}
.cat .ic svg{width:21px;height:21px}
.cat b{display:block;font-size:16px;font-weight:600}
.cat span{font-size:13.5px;color:var(--t2)}
.cat .stt{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%}

.house{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;width:100%;margin-top:11px}
.house .ic{width:44px;height:44px;border-radius:13px;background:var(--info-bg);color:var(--info-t);display:grid;place-items:center}
.house .ic svg{width:22px;height:22px}
.house .tx{flex:1}
.house .tx b{display:block;font-size:16px;font-weight:600}
.house .tx span{font-size:13.5px;color:var(--t2);display:block;margin-top:2px}
.house .go{color:var(--t3)}

.empty{background:var(--card);border-radius:18px;padding:30px 22px;text-align:center;box-shadow:var(--sh)}
.empty .ic{width:56px;height:56px;border-radius:17px;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center;margin:0 auto 15px}
.empty .ic svg{width:28px;height:28px}
.empty b{display:block;font-size:17px;font-weight:600;margin-bottom:6px}
.empty p{font-size:14.5px;color:var(--t2);max-width:32ch;margin:0 auto 20px}

.pick{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:10px;width:100%}
.pick .ic{width:44px;height:44px;border-radius:13px;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center}
.pick .ic svg{width:22px;height:22px}
.pick .tx{flex:1}
.pick .tx b{display:block;font-size:16.5px;font-weight:600}
.pick .tx span{font-size:13.5px;color:var(--t2);display:block;margin-top:2px;line-height:1.4}
.pick .go{color:var(--t3)}
.pick .go svg{width:19px;height:19px}
.pick.sel{outline:2px solid var(--accent);outline-offset:-2px}
.pick.sel .ic{background:var(--accent);color:#fff}

.thing{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:15px;padding:15px;box-shadow:var(--sh);margin-bottom:9px;width:100%}
.thing .tx{flex:1;min-width:0}
.thing .tx b{display:block;font-size:16px;font-weight:600}
.thing .tx .stt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;margin-top:3px}
.thing .tx .via{display:block;font-size:13px;color:var(--t3);margin-top:3px}
.thing .go{color:var(--t3)}
.thing .go svg{width:18px;height:18px}

.field{width:100%;font:inherit;font-size:17px;padding:16px;border:1.5px solid var(--fb);border-radius:14px;background:#fff;color:var(--t1)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,122,78.13)}
.field::placeholder{color:var(--t3)}
.note{background:var(--info-bg);border-radius:15px;padding:17px;margin-bottom:16px}
.note>span b{font-weight:700;color:var(--info-t)}
.note>b{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:600;color:var(--info-t);margin-bottom:9px}
.note>b svg{width:17px;height:17px}
.note>span{display:block;font-size:14.5px;line-height:1.55;color:var(--t1);margin-bottom:9px}
.notelink{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--info-t);padding:4px 0}
.notelink svg{width:15px;height:15px}
.msg-card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--cb)}
.msg-head{display:flex;align-items:baseline;gap:9px;padding:12px 16px;border-bottom:1px solid var(--divider);background:#F7FAF7}
.msg-head .kind{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--t3)}
.msg-head .from{font-size:14px;font-weight:600;color:var(--t1)}
.msg-body{padding:16px;font-size:15.5px;line-height:1.55;color:var(--ink)}
.reveal{background:var(--info-bg);border-radius:16px;padding:18px;margin-top:16px}
.reveal>b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--info-t);margin-bottom:10px}
.reveal>b svg{width:15px;height:15px}
.reveal ul{margin:0;padding-left:19px}
.reveal li{font-size:14.5px;line-height:1.5;color:var(--t1);margin-bottom:9px}
.reveal .doline{background:var(--card);border-radius:11px;padding:13px 15px;margin-top:14px}
.reveal .doline b{display:block;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ok-t);margin-bottom:5px}
.reveal .doline span{font-size:14.5px;line-height:1.5;color:var(--t1)}
.lesson{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:10px}
.lesson .n{width:26px;height:26px;border-radius:50%;background:var(--ok-bg);color:var(--ok-t);font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.lesson b{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
.lesson span{font-size:14.5px;color:var(--t2);line-height:1.5}
.script{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--sh);margin-bottom:10px;border-left:4px solid var(--accent)}
.script b{display:block;font-size:13.5px;font-weight:700;color:var(--t2);margin-bottom:6px}
.script span{font-size:15.5px;color:var(--ink);line-height:1.55}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px}
.sug{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1.5px solid var(--cb);border-radius:22px;padding:10px 15px;font-size:15px;font-weight:500;color:var(--t1);box-shadow:var(--sh)}
.sug svg{width:16px;height:16px;color:var(--accent)}
.sug.got{background:var(--ok-bg);border-color:#BBD8C2;color:var(--ok-t)}
.sug.got svg{color:var(--ok-t)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{background:#fff;border:1.5px solid var(--cb);border-radius:20px;padding:9px 15px;font-size:14.5px;font-weight:500;color:var(--t2)}

.q{background:var(--card);border-radius:15px;padding:16px;box-shadow:var(--sh);margin-bottom:11px}
.q .row{display:flex;gap:14px;align-items:flex-start}
.q .box{width:27px;height:27px;border-radius:9px;border:2px solid var(--fb);background:#fff;display:grid;place-items:center;margin-top:1px;transition:.14s}
.q .box svg{width:15px;height:15px;color:#fff;opacity:0;transition:.14s}
.q.yes .box{background:var(--accent);border-color:var(--accent)}
.q.yes .box svg{opacity:1}
.q.unsure{box-shadow:var(--sh),inset 3.5px 0 0 var(--info-t)}
.rule{background:#fff;border-radius:16px;padding:17px 18px;margin-bottom:12px;box-shadow:var(--sh);border-left:3.5px solid var(--info-t)}
.rule b{display:block;font-size:17px;line-height:1.35;margin-bottom:7px}
.rule span{display:block;font-size:15.5px;line-height:1.55;color:var(--t2)}
.rule em{display:block;font-style:normal;font-size:14.5px;line-height:1.5;color:var(--t2);background:var(--info-bg);border-radius:11px;padding:11px 13px;margin-top:11px}
.q .tx{flex:1}
.q .tx b{display:block;font-size:16px;font-weight:500;line-height:1.4;color:var(--ink)}
.q.yes .tx b{color:var(--t2)}
.q .why{font-size:14.5px;color:var(--t2);margin-top:10px;line-height:1.5;padding-left:41px}
.q .todoline{font-size:14.5px;color:var(--brand);font-weight:600;margin-top:10px;padding-left:41px;display:flex;gap:8px;align-items:flex-start;line-height:1.45}
.q .todoline svg{width:16px;height:16px;margin-top:3px}
.q .findout{margin:12px 0 0 41px;background:var(--info-bg);border-radius:11px;padding:13px 15px}
.q .findout b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--info-t);margin-bottom:6px}
.q .findout b svg{width:15px;height:15px}
.q .findout span{display:block;font-size:14.5px;line-height:1.5;color:var(--t1)}
.q .findout em{display:block;font-style:normal;font-size:14px;line-height:1.5;color:var(--info-t);font-weight:600;margin-top:11px;padding-top:11px;border-top:1px solid rgba(26,95,168.18)}
.q .acts{margin-top:8px;padding-left:41px}
.notsure{font-size:14px;font-weight:600;color:var(--info-t);display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.notsure svg{width:16px;height:16px}
.tag{background:var(--info-bg);color:var(--info-t);font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:8px}

.done{text-align:center;padding-top:18px}
.done .burst{width:94px;height:94px;border-radius:50%;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center;margin:0 auto 20px}
.done .burst svg{width:44px;height:44px}
.done p{color:var(--t2);font-size:15.5px;max-width:33ch;margin:8px auto 0}
.linkline{background:var(--info-bg);color:var(--info-t);border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.45;margin-top:18px;text-align:left}

footer{padding:24px 0 32px;text-align:center}
footer p{font-size:13px;color:var(--t3);line-height:1.6;max-width:42ch;margin:0 auto 9px}
/* ---------- wider screens: stop being a phone app stranded on a desktop ----------
   Placed last so these win on source order over the base rules above. */
@media (min-width:760px){
  .col{max-width:700px;padding:0 28px}
  .cats{grid-template-columns:repeat(3,1fr)}
  .twoup{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:stretch}
  .twoup .house{margin-top:0}
  .empty{max-width:520px;margin:0 auto}
}
@media (min-width:1024px){
  .col{max-width:820px}
  h1{font-size:33px} h2{font-size:26px}
  .stack{max-width:440px}
  .q .tx b,.q .why,.q .findout span,.q .todoline{max-width:66ch}
  .hero .msg{font-size:18px}
}
@media (min-width:1400px){ .col{max-width:900px} }

</style>
</head>
<body>
<div class="bar"><div class="col" id="bar"></div></div>
<main><div class="col" id="app"></div></main>

 {id:"lock",w:30,q:"You need a PIN, fingerprint or face to unlock it",
  why:"An unlocked device is every account already signed in on it. Most things lost this way are simply left somewhere rather than broken into.",
  find:"Lock the screen, then wake it up. If it lets you straight back in without asking for anything, it isn't set."},
 {id:"auto",w:10,q:"It updates itself, so you don't have to remember",
  why:"The part you notice, a new look or buttons that moved, is the small part of an update. Most of it is closing specific holes that someone already found and published. Once a hole is public it gets used, so the gap between a fix being released and you installing it is the whole window.\n\nTurn updates on automatically, and restart when it asks. Plenty of fixes don't take effect until you do.",
  find:"Look in Settings for 'Software update' or 'System update'. It'll say whether automatic updates are switched on."},
 {id:"supp",w:10,q:"It's new enough that the company still sends updates",
  why:"When a company stops supporting something, the holes don't stop being found. They just stop being fixed, and they stay published where anyone can read them. The device keeps working perfectly, which is exactly what makes this easy to miss, and it gets a little more exposed every month.",
  find:"Find the model name in Settings, then search it along with the words 'end of support'. If it's more than about six years old, assume the answer is no."},
 {id:"av",w:5,q:"It warns you about dangerous files and websites",
  why:"Your computer already has this built in and it's good enough. The only thing to check is that it hasn't been switched off.",
  find:"On a Windows computer, look for 'Windows Security' in the start menu. On a Mac it is built in and always on. Either will tell you on its own screen if something has been switched off."}];

 {id:"port",w:30,q:"Your phone company won't move your number to a new SIM without a PIN",

const cat=id=>CATS.find(c=>c.id===id);
const typ=(c,t)=>c.types.find(x=>x.id===t);
function checksFor(c,it){
  const t=typ(c,it.t);
  let out=((t&&t.replace)?[]:c.base.slice()).concat(t?t.extra:[]);
  if(it.isApp) out=out.concat(ACC_APP);
  return out;
}

const house={};

/* ================= model, never displayed ================= */
const yes=(o,k)=>o[k]===true;
const uns=(o,k)=>o[k]==="unsure";
const openBig=(c,it)=>checksFor(c,it).filter(k=>k.w===30&&!yes(it.a,k.id));
const stOf=(c,it)=>openBig(c,it).length?"crit":checksFor(c,it).every(k=>yes(it.a,k.id))?"ok":"rev";
const hOpenBig=()=>HOUSE.filter(k=>k.w===30&&!yes(house,k.id));
const hSt=()=>hOpenBig().length?"crit":HOUSE.every(k=>yes(house,k.id))?"ok":"rev";
const ST={crit:["Needs attention","var(--crit-dot)","var(--crit-t)"],
          rev:["A few things left","var(--rev-dot)","var(--caut-t)"],
          ok:["Everything we check","var(--ok-dot)","var(--ok-t)"]};
const allThings=()=>CATS.flatMap(c=>store[c.id].map(it=>({c,it})));
const covered=()=>allThings().filter(({c,it})=>stOf(c,it)==="ok").length+(hSt()==="ok"?1:0);
const totalUnits=()=>allThings().length+1;
const todos=()=>[...allThings().flatMap(({c,it})=>openBig(c,it).filter(k=>!uns(it.a,k.id)).map(k=>({c,it,k}))),
                 ...hOpenBig().filter(k=>!uns(house,k.id)).map(k=>({c:null,it:null,k}))];
const lookups=()=>[...allThings().flatMap(({c,it})=>checksFor(c,it).filter(k=>uns(it.a,k.id)).map(k=>({c,it,k}))),
                   ...HOUSE.filter(k=>uns(house,k.id)).map(k=>({c:null,it:null,k}))];
const sharedBy=id=>CATS.flatMap(c=>store[c.id]).filter(x=>x.link===id);

function go(v){view=v;render();window.scrollTo(0,0);}
window.go=go;
function bar(){
  const b=document.getElementById("bar");
  /* the brand row is identical on every screen — it never depends on view.s */
  const brand=`<div class="brand"><img src="${DOG}" alt=""><div class="wm">My Digital Guardian</div></div>`;
  if(view.s==="welcome"||view.s==="home"){
    b.innerHTML=brand;
  }else{
    /* every inner screen already prints its own heading, so the bar carries the
       brand and the way back, nothing else */
    b.innerHTML=brand+`<div class="sp"></div><button class="back" id="bk">${I("back",2.4)}Back</button>`;
    document.getElementById("bk").onclick=()=>go(view.back||{s:"home"});
  }
}

function ring(d,t){const r=27,C=2*Math.PI*r,p=t?d/t:0;
 return `<div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--divider)" stroke-width="6"/>
 <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>
 <div class="num">${d}/${t}</div></div>`;}

function todoRow(t,look){
  /* habits are things to set up, not defects. They never wear the alarm flag */
  const habit=!t.it;
  const where=habit?"You and your household":esc(t.it.name);
  const click=habit?`go({s:'house',title:'Your household',back:{s:'home'}})`:`openItem('${t.c.id}','${t.it.id}')`;
  const cls=look?"look":habit?"habit":"";
  return `<button class="todo ${cls}" onclick="${click}">
    <span class="flag">${I(look?"info":habit?"people":"alert")}</span>
    <span class="tx"><b>${esc(t.k.q)}</b><span>${where}</span></span>
    <span class="go">${I("chev")}</span></button>`;}

      <div class="reveal">
        <b>${I("search")}${e.off?"What gives it away":"What's going on here"}</b>
        <ul>${e.tells.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
        <div class="doline"><b>${e.off?"What to do instead":"What to do"}</b><span>${esc(e.what).replace(/\n\n/g,"<br><br>")}</span></div>
      </div>
      <div class="stack">
        ${i+1<EXAMPLES.length
          ? `<button class="big" onclick="go({s:'learn',ex:${i+1},title:'Spotting it',back:view.back})">Next one</button>`
          : `<button class="big" onclick="go({s:'tells',title:'Spotting it',back:view.back})">What they all had in common</button>`}
      </div>`
    :`<div class="stack">
        <button class="big ghost" onclick="reveal()">This one looks fine</button>
        <button class="big ghost" onclick="reveal()">Something's off about it</button>
      </div>
      <p class="hint2" style="text-align:center;margin-top:14px">Either way, we'll show you what to look at.</p>`}
  </div>`;}

function tells(){
  return `<div class="sc"><h2>What they all had in common</h2>
  <p class="sub" style="margin-bottom:20px">You don't have to spot the trick. You only have to notice these, and they're the same every time.</p>
  ${TELLS.map(([t,d],n)=>`<div class="lesson"><span class="n">${n+1}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join("")}
  <span class="eyebrow" style="display:block;margin:28px 0 12px">Things you can actually say</span>
  <p class="sub" style="margin:-4px 0 16px">Most people freeze because they haven't got the words ready. These are the words.</p>
  ${SCRIPTS.map(([t,d])=>`<div class="script"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}
  <div class="stack"><button class="big" onclick="go({s:'home'})">Back to my Guardian</button></div></div>`;}

function social(){
  return `<div class="sc"><h2>Social media</h2>
  <p class="sub" style="margin-bottom:6px">Nothing to add and nothing to score. What to change once, what to leave out of a post, and what to keep doing.</p>
  <p class="hint2" style="margin-bottom:22px">Not every app offers every one of these, and the ones that do keep them in different places under different names. Where a setting doesn't exist, it says so below, so you're not left looking for something that isn't there. Checked against each company's own help pages in August 2026.</p>
  <span class="eyebrow" style="display:block;margin:0 0 12px">Change these once</span>
  ${SOCIAL_SETUP.map(([t,d],n)=>`<div class="lesson"><span class="n">${n+1}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join("")}
  <span class="eyebrow" style="display:block;margin:28px 0 12px">Think twice before these go in a post</span>
  <p class="sub" style="margin:-4px 0 6px">Settings decide who's reading. This is about what's there to read.</p>
  <p class="hint2" style="margin-bottom:16px">Every one of these is ordinary on its own. Nobody is caught out by a single post. They're collected, put next to each other, and used together, which is why the list matters more than any one line on it.</p>
  ${SOCIAL_DONTPOST.map(([t,d])=>`<div class="script"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}
  <div class="linkline">This isn't a reason to stop posting. Posting is the point of the thing. It's a reason to decide who's reading first, and to leave out the few details that do the damage.</div>

  <span class="eyebrow" style="display:block;margin:28px 0 12px">Then keep doing these</span>
  ${SOCIAL_HABITS.map(([t,d])=>`<div class="script"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}
  <div class="linkline">If you'd like this tracked rather than just read, add your account under Add what you have. You'll get the same ground as a checklist, and it counts toward what's done.</div>
  <div class="stack">
    <button class="big ghost" onclick="go({s:'type',cid:'accounts',title:'Add account',back:{s:'social',title:'Social media',back:{s:'home'}}})">${I("plus")}Add my account and track it</button>
    <button class="big" onclick="go({s:'home'})">Back to my Guardian</button></div></div>`;}

function pick(){return `<div class="sc"><h2>What would you like to add?</h2>
  <p class="sub" style="margin-bottom:20px">One at a time. You can add as many as you like.</p>
  ${CATS.map(c=>`<button class="pick" onclick="go({s:'type',cid:'${c.id}',title:'Add ${esc(c.one)}',back:{s:'pick',title:'Add something',back:{s:'home'}}})">
    <span class="ic">${I(c.icon)}</span><span class="tx"><b>${esc(c.name)}</b><span>${esc(c.blurb)}</span></span>
    <span class="go">${I("chev")}</span></button>`).join("")}</div>`;}

function type(){const c=cat(view.cid);
  return `<div class="sc"><h2>What kind of ${esc(c.one)}?</h2>
  <p class="sub" style="margin-bottom:20px">Only so we ask you the right questions.</p>
  ${c.types.map(t=>`<button class="pick" onclick="chooseType('${t.id}')">
    <span class="ic">${I(t.icon)}</span><span class="tx"><b>${esc(t.name)}</b><span>${esc(t.hint)}</span></span>
    <span class="go">${I("chev")}</span></button>`).join("")}</div>`;}

function nameScreen(){const c=cat(view.cid),t=typ(c,pendType);
  return `<div class="sc"><h2>What do you want to call it?</h2>
  <p class="sub" style="margin-bottom:8px">A nickname you'll recognize is plenty. Try to avoid the brand, the app name, or the model.</p>
  <p class="hint2" style="margin-bottom:18px">"The front camera" beats naming the make, and "my bank" beats naming the bank. Then this list tells a stranger nothing, even if they read it over your shoulder.</p>
  <input class="field" id="nm" placeholder="${esc(t.eg[0])}" value="${esc(draft)}" autocomplete="off">
  <div class="chips">${t.eg.map(e=>`<button onclick="setDraft(this.textContent)">${esc(e)}</button>`).join("")}</div>
  ${c.id==="accounts"?`<button class="pick ${pendApp?"sel":""}" style="margin-top:22px" onclick="toggleApp()">
    <span class="ic">${I("phone")}</span><span class="tx"><b>It's also an app on my phone</b>
    <span>Adds two questions about what the app can reach</span></span>
    <span class="go">${pendApp?I("check"):""}</span></button>`:""}
  <div class="stack"><button class="big" id="nx" ${draft.trim()?"":"disabled"}>Next</button></div></div>`;}

function linkScreen(){const accs=store.accounts;
  return `<div class="sc"><h2>Which account controls it?</h2>
  <p class="sub" style="margin-bottom:20px">Nearly every connected thing is run through an account or an app, and that account is usually the easier way in. Fixing one takes care of everything on it.</p>
  ${accs.map(a=>`<button class="pick" onclick="setLink('${a.id}')"><span class="ic">${I("key")}</span>
    <span class="tx"><b>${esc(a.name)}</b><span>${sharedBy(a.id).length?sharedBy(a.id).length+" other thing"+(sharedBy(a.id).length===1?"":"s")+" already on it":"Already on your list"}</span></span></button>`).join("")}
  <button class="pick" onclick="setLink('new')"><span class="ic">${I("plus")}</span>
    <span class="tx"><b>Add that account</b><span>We'll ask about it next</span></span></button>
  <button class="pick" onclick="setLink('')"><span class="ic">${I("info")}</span>
    <span class="tx"><b>I'm not sure</b><span>You can always come back to this</span></span></button></div>`;}

function checkBlock(k,ans,onT,onU){
  const y=yes(ans,k.id),u=uns(ans,k.id);
  return `<div class="q ${y?"yes":""} ${u?"unsure":""}">
    <div class="row"><button class="box" onclick="${onT}" aria-label="Yes, that is true">${I("check",3)}</button>
      <div class="tx">${u?`<span class="tag">Not sure yet</span>`:""}
        <b onclick="${onT}">${esc(k.q)}</b></div></div>
    ${y?"":`<div class="why">${esc(k.why).replace(/\n\n/g,"<br><br>")}</div>`}
    ${u?`<div class="findout"><b>${I("search")}How to find out</b><span>${esc(k.find)}</span>
        <em>${esc(k.safe||"Still can't tell? Treat it as not done. Everything on this list is safe to do twice. You can't break anything by doing it again.")}</em></div>`:""}
    ${!y&&k.todo?`<div class="todoline">${I("spark")}<span>${esc(k.todo)}</span></div>`:""}
    ${!y&&!u?`<div class="acts"><button class="notsure" onclick="${onU}">${I("info")}I'm not sure</button></div>`:""}</div>`;}

function item(){
  const c=cat(view.cid),it=findItem(view.cid,view.iid);
  if(!it)return home();
  const ks=checksFor(c,it),left=ks.filter(k=>!yes(it.a,k.id)).length;
  const acc=it.link?accById(it.link):null,sh=acc?sharedBy(acc.id).length:0;
  return `<div class="sc"><h2>${esc(it.name)}</h2>
  <p class="sub" style="margin-bottom:${acc?"8px":"18px"}">${left?`Check off anything that's already true. ${left} to look at.`:"Everything here is checked off."}</p>
  ${acc?`<p class="hint2" style="margin-bottom:18px">Run through <b>${esc(acc.name)}</b>${sh>1?`, along with ${sh-1} other thing${sh-1===1?"":"s"}`:""}.</p>`:""}
  ${(()=>{const t=typ(c,it.t);return t&&t.note?`<div class="note"><b>${I("info")}${esc(t.note.t)}</b>
     <span>${esc(t.note.b).replace(/\n\n/g,"</span><span>")}</span>${t.note.b2?`<span>${esc(t.note.b2)}</span>`:""}
     <button class="notelink" onclick="go({s:'learn',ex:0,title:'Spotting it',back:{s:'item',cid:'${c.id}',iid:'${it.id}',title:'${esc(c.name)}',back:{s:'home'}}})">See what these look like${I("chev")}</button></div>`:"";})()}
  ${ks.map(k=>checkBlock(k,it.a,`tog('${k.id}')`,`unsure('${k.id}')`)).join("")}
  <div class="stack"><button class="big" onclick="finish()">${left?"Save and go back":"Done"}</button></div></div>`;}

function houseScreen(){
  const left=HOUSE.filter(k=>!yes(house,k.id)).length;
  return `<div class="sc"><h2>You and your household</h2>
  <p class="sub" style="margin-bottom:18px">The part no gadget can do for you. First a few things that are always true, then a few worth putting in place.</p>
  <div class="eyebrow">Always true, nothing to do</div>
  <p class="hint2" style="margin:2px 0 14px">Worth reading once. There is no exception to any of them.</p>
  ${RULES.map(r=>`<div class="rule"><b>${esc(r.t)}</b><span>${esc(r.b).replace(/\n\n/g,"</span><span style='margin-top:9px'>")}</span>${r.safe?`<em>${esc(r.safe)}</em>`:""}</div>`).join("")}
  <div class="eyebrow" style="margin-top:30px">Worth putting in place</div>
  <p class="hint2" style="margin:2px 0 14px">${left?`${left} to look at.`:"All done."}</p>
  ${HOUSE.map(k=>checkBlock(k,house,`togH('${k.id}')`,`unsH('${k.id}')`)).join("")}
  <div class="note" style="margin-top:20px"><b>${I("people")}If the person you're worried about knows you</b>
    <span>Everything above assumes the trouble comes from a stranger. If it's a partner, an ex, or someone in the family, this isn't the right advice, and some of it, like changing passwords or turning on alerts, can be noticed and make things worse.</span>
    <span>It doesn't have to have been physical. Being tracked, having your messages, photos or location checked, being asked for your passwords, being controlled through money, or being made to feel afraid of what happens if you say no. That is abuse too, and none of it needs to have turned into being hit, pushed or touched for you to be entitled to help.</span>
    <span>You don't have to be certain, and you don't have to be planning to leave. You can call and just describe what's happening and let someone who does this every day tell you what they make of it.</span>
    <span>In the US, the National Domestic Violence Hotline is <b>1-800-799-7233</b>, day or night. They help with phones, accounts and being tracked, not only with leaving.</span>
    <span>If speaking isn't safe, because someone is nearby or might hear, you don't have to call at all. Text <b>START</b> to <b>88788</b>, or open the chat at thehotline.org. Both reach the same advocates as the phone line.</span>
    <span>If you are Deaf, DeafBlind or hard of hearing, the National Deaf Domestic Violence Hotline is <b>855-812-1001</b> by video phone, answered in ASL by advocates who are Deaf themselves.</span></div>
  <div class="stack"><button class="big" onclick="go({s:'home'})">Back to my Guardian</button></div></div>`;}

function done(){
  const c=cat(view.cid),it=findItem(view.cid,view.iid);
  if(!it)return home();
  const s=stOf(c,it),acc=it.link?accById(it.link):null,sh=acc?sharedBy(acc.id).length:0;
  return `<div class="sc done"><div class="burst">${I(s==="ok"?"check":"shield",2.3)}</div>
    <h2>${s==="ok"?"That's everything we check.":"Saved."}</h2>
    <p>${s==="ok"?`Everything we ask about ${esc(it.name)} is done. Not the same as safe, but it is the part you control.`
      :`${esc(it.name)} is on your list, and anything urgent is at the top of the home screen.`}</p>
    ${sh>1?`<div class="linkline">${esc(acc.name)} also controls ${sh-1} other thing${sh-1===1?"":"s"} on your list. Fixing that one account takes care of all of them at once.</div>`:""}
    <div class="stack"><button class="big" onclick="go({s:'sweep',title:'Anything else?',back:{s:'home'}})">${I("plus")}Anything else around the house?</button>
      <button class="big ghost" onclick="go({s:'home'})">Back to my Guardian</button></div></div>`;}

function list(){const c=cat(view.cid);
  return `<div class="sc"><h2>${esc(c.name)}</h2><p class="sub" style="margin-bottom:20px">${esc(c.blurb)}</p>
  ${store[c.id].length?store[c.id].map(it=>{const s=stOf(c,it),a=it.link?accById(it.link):null;
    return `<button class="thing" onclick="openItem('${c.id}','${it.id}')"><span class="tx"><b>${esc(it.name)}</b>
      <span class="stt" style="color:${ST[s][2]}"><span class="dot" style="background:${ST[s][1]}"></span>${ST[s][0]}</span>
      ${a?`<span class="via">Run through ${esc(a.name)}</span>`:""}</span><span class="go">${I("chev")}</span></button>`;}).join("")
   :`<div class="empty"><div class="ic">${I(c.icon)}</div><b>Nothing here yet</b><p>${esc(c.blurb)}</p></div>`}
  <div class="stack"><button class="big ghost" onclick="go({s:'type',cid:'${c.id}',title:'Add ${esc(c.one)}',back:{s:'list',cid:'${c.id}',title:'${esc(c.name)}',back:{s:'home'}}})">${I("plus")}Add ${/^[aeiou]/i.test(c.one)?"an":"a"} ${esc(c.one)}</button></div></div>`;}

/* ================= actions ================= */
window.reveal=()=>{view.rev=true;render();};
window.quickAdd=(n,cid,t)=>{
  const it=mk(n,t); store[cid].push(it);
  const bk={s:"sweep",title:"Anything else?",back:{s:"home"}};
  if(cid==="smart"&&store.accounts.length){pendLink={cid,iid:it.id};go({s:"link",title:"Which account?",back:bk});return;}
  go({s:"item",cid,iid:it.id,title:cat(cid).name,back:bk});
};
window.wipe=()=>{
  if(!wiping){wiping=true;render();setTimeout(()=>{wiping=false;render();},4000);return;}
  CATS.forEach(c=>store[c.id].length=0);
  Object.keys(house).forEach(k=>delete house[k]);
  wiping=false; go({s:"welcome"});
};
window.startWith=(type,name)=>{
  const it=mk(name,type); store.devices.push(it);
  go({s:"item",cid:"devices",iid:it.id,title:"Devices",back:{s:"home"}});
};
window.setDraft=v=>{draft=v;render();const n=document.getElementById("nm");if(n){n.focus();n.setSelectionRange(v.length,v.length);}};
window.chooseType=t=>{pendType=t;draft="";pendApp=false;go({s:"name",cid:view.cid,title:view.title,back:view.back});};
window.toggleApp=()=>{pendApp=!pendApp;render();};
window.openItem=(cid,iid)=>go({s:"item",cid,iid,title:cat(cid).name,back:{s:"list",cid,title:cat(cid).name,back:{s:"home"}}});
window.tog=k=>{const it=findItem(view.cid,view.iid);it.a[k]=it.a[k]===true?undefined:true;render();};
window.unsure=k=>{const it=findItem(view.cid,view.iid);it.a[k]="unsure";render();};
window.togH=k=>{house[k]=house[k]===true?undefined:true;render();};
window.unsH=k=>{house[k]="unsure";render();};
window.finish=()=>go({s:"done",cid:view.cid,iid:view.iid,title:"",back:{s:"home"}});
window.setLink=v=>{
  const w=pendLink;
  if(v==="new"){go({s:"type",cid:"accounts",title:"Add account",back:{s:"home"}});return;}
  const it=findItem(w.cid,w.iid); it.link=v||null; pendLink=null;
  go({s:"item",cid:w.cid,iid:w.iid,title:cat(w.cid).name,back:{s:"home"}});
};

function addScreen(){
  const n=CATS.reduce((a,c)=>a+store[c.id].length,0);
  return `<div class="sc"><h2>Add what you have</h2>
  <p class="sub" style="margin-bottom:18px">So the advice fits what's actually in your house.</p>

  <div class="rule" style="margin-bottom:22px">
    <b>Why this step exists</b>
    <span>A phone, an email account and a doorbell camera each need completely different things looked at. There's no single list that's right for everyone.</span>
    <span style="margin-top:9px">Once you add something, you only see the checks that apply to it. Everything about gadgets you don't own stays out of your way.</span>
    <span style="margin-top:9px">You don't have to add everything, and there's no order. One thing is enough to begin, and you can come back whenever you think of something else.</span>
  </div>

  ${n?`<p class="hint2" style="margin-bottom:16px">${n} added so far.</p>`:`
  <span class="eyebrow" style="margin-top:0">The easiest one to start with</span>
  <p class="sub" style="margin:2px 0 12px">What are you reading this on? It's right here, so it takes a few seconds.</p>
  <div class="chipgrid" style="margin-bottom:26px">${OWN.map(o=>`<button class="sug" onclick="startWith('${o.type}','${esc(o.name)}')">${I(o.icon)}<span>${esc(o.word)}</span></button>`).join("")}</div>`}

  <span class="eyebrow">${n?"Add something":"Or start somewhere else"}</span>
  <p class="sub" style="margin:2px 0 12px">You can add as many as you like, in any order.</p>
  <div class="cats">${CATS.map(c=>{
    const k=store[c.id].length;
    return `<button class="cat" onclick="go({s:'type',cid:'${c.id}',title:'Add ${esc(c.one)}',back:{s:'add',title:'Add what you have',back:{s:'home'}}})">
      <span class="ic">${I(c.icon)}</span><b>${esc(c.name)}</b><span>${k?k+" added":esc(c.blurb)}</span></button>`;}).join("")}</div>

  <div class="stack"><button class="big ghost" onclick="go({s:'sweep',title:'Anything else?',back:{s:'add',title:'Add what you have',back:{s:'home'}}})">${I("search")}Things people forget they have</button>
    <button class="big" onclick="go({s:'home'})">Back to my Guardian</button></div></div>`;}

const SCREENS={welcome,home,pick,sweep,learn,tells,social,type,name:nameScreen,link:linkScreen,list,item,done,house:houseScreen,add:addScreen};

function render(){
  bar();
  document.getElementById("app").innerHTML=(SCREENS[view.s]||home)();
  document.getElementById("foot").innerHTML="";
  if(view.s==="name"){
    const n=document.getElementById("nm"),nx=document.getElementById("nx");
    n.focus();
    n.oninput=()=>{draft=n.value;nx.disabled=!draft.trim();};
    n.onkeydown=e=>{if(e.key==="Enter"&&draft.trim())nx.click();};
    nx.onclick=()=>{
      const c=cat(view.cid),it=mk(draft.trim(),pendType);
      if(c.id==="accounts"&&pendApp)it.isApp=true;
      store[view.cid].push(it);draft="";pendApp=false;
      if(pendLink&&c.id==="accounts"){                 /* created to satisfy a link */
        const w=findItem(pendLink.cid,pendLink.iid); if(w)w.link=it.id; pendLink=null;
      }else if(c.id==="smart"){
        pendLink={cid:c.id,iid:it.id};
        go({s:"link",title:"Which account?",back:{s:"home"}});return;
      }
      go({s:"item",cid:c.id,iid:it.id,title:c.name,back:{s:"home"}});
    };
  }
}
render();
</script>
</body>
</html>
